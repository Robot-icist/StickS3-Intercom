; =============================================================================
;  StickS3 Intercom portable unit
;  Hardware: M5Stack StickS3
;
;  The AtomS3R-Intercom project must be built and flashed separately. Both
;  projects share the IntercomShared library one directory up.
; =============================================================================

[platformio]
default_envs = sticks3_intercom
src_dir = src

[env:sticks3_intercom]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 1500000

; ESP32-S3-PICO-1-N8R8: 8 MB QIO flash + 8 MB OPI PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

; Pick up the shared library from the project-local submodule.
;lib_extra_dirs = lib
lib_extra_dirs = ../IntercomShared
lib_deps =
    m5stack/M5Unified@0.2.28

; Auto-copy web data before building filesystem image
extra_scripts = 
    ; pre:lib/IntercomShared/tools/patch_m5unified.py
    ; pre:lib/IntercomShared/tools/copy_web_data.py
    pre:../IntercomShared/tools/patch_m5unified.py
    pre:../IntercomShared/tools/copy_web_data.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DINTERCOM_BOARD_STICKS3
    -DINTERCOM_DEVICE_NAME=\"STICK\"
    -DINTERCOM_CHANNEL=1
    -DCORE_DEBUG_LEVEL=0
